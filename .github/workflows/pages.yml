name: Publish prototype to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/validate_data.py
      - run: python scripts/validate_segmentation.py
      - run: python scripts/validate_answers.py
      - run: python scripts/validate_u_solutions.py
      - run: python scripts/validate_source_registry.py
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npx firebase emulators:exec --only firestore --project demo-ap2-sync "node --test firebase/rules.emulator.mjs && npx vitest run firebase/transport.emulator.test.ts"
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      - run: python scripts/publish_layout_evidence.py
      - run: python scripts/publish_phase2d.py
      - run: python scripts/publish_phase2e.py
      - run: python scripts/publish_phase2e1.py
      - run: python scripts/publish_module_year_filter.py
      - run: python scripts/publish_phase2f.py
      - run: python scripts/publish_phase2g.py
      - run: python scripts/publish_phase2i.py
      - run: python scripts/publish_phase2i1.py
      - run: python scripts/publish_phase2i2.py
      - run: python scripts/publish_evidence.py phase2j
      - run: python scripts/publish_evidence.py phase2j1
      - run: python scripts/publish_evidence.py phase2j2
      - run: python scripts/publish_evidence.py phase2k
      - run: python scripts/publish_evidence.py phase2k1
      - run: python scripts/publish_evidence.py phase2k1-release
      - run: python scripts/publish_evidence.py winter2020-21
      - run: python scripts/publish_evidence.py practice-ux
      - run: python scripts/publish_evidence.py sommer2021
      - run: python scripts/publish_evidence.py winter2021-22
      - run: python scripts/publish_evidence.py sommer2022
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
